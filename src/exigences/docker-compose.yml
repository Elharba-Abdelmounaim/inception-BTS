services:
  mariadb:
    build:    
      context: ./mariadb
    container_name: my_database
    restart: always
    env_file:
      - ./mariadb/tools/.env
    volumes:
      - ./mariadb/conf/60-server.cnf:/etc/mysql/mariadb.conf.d/60-server.cnf
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - my_network

  nginx:
    build: ./nginx
    container_name: my_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - mariadb
    networks:
      - my_network

volumes:
  db_data:

networks:
  my_network:
    driver: bridge

